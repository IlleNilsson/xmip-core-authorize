# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-authorize"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authorize"
description = "The Xmip authorization gate: may this identity do this, here."

[dependencies]
xmip-core = { git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
xmip-context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
